name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ruff check .
        run: ruff check .

      - name: pytest
        run: pytest

      - name: Clean start smoke test
        run: |
          rm -rf data
          python -c "
          from fastapi.testclient import TestClient
          from app.main import create_app
          with TestClient(create_app()) as c:
              assert c.get('/healthz').json() == {'status': 'ok'}
              r = c.post('/approvals', data={'title': 'CI', 'text': 'hello'},
                         follow_redirects=False)
              assert r.status_code == 303, r.text
          print('clean start OK')
          "

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t approval-pack:ci .

      - name: Boot the container and check /healthz
        run: |
          docker run -d --name approval-pack-ci -p 8000:8000 approval-pack:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo; echo "container healthy"; exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy"
          docker logs approval-pack-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs approval-pack-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f approval-pack-ci || true
